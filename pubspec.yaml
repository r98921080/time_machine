name: time_machine
description: 時光機 — 生活目標與健康管理，融合角色養成。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # AI
  google_generative_ai: ^0.4.6

  # Local DB
  sqflite: ^2.3.2
  path_provider: ^2.1.3

  # State
  provider: ^6.1.2

  # Media
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/characters/
    - assets/shop/
