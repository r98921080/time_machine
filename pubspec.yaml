name: time_machine
description: 時光機 — 生活目標與健康管理，融合角色養成。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # AI
  google_generative_ai: ^0.4.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Local DB
  sqflite: ^2.3.2
  path_provider: ^2.1.3

  # State
  provider: ^6.1.2

  # UI
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  table_calendar: ^3.1.2

  # Media
  image_picker: ^1.1.2
  share_plus: ^9.0.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  http: ^1.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/characters/
    - assets/shop/
